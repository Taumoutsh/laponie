name: laponie

services:
  app:
    build: .
    image: laponie:latest
    container_name: laponie
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:?Définir SESSION_SECRET dans .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-laponie}:${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-laponie}?schema=public
      PORT: ${APP_PORT:-6104}
      TZ: Europe/Paris
    # Aucun port publié sur l'hôte : Nginx Proxy Manager joint « laponie:6104 » par son réseau.
    expose:
      - "${APP_PORT:-6104}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - npm

  db:
    image: postgres:18-alpine
    container_name: laponie-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laponie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-laponie}
      TZ: Europe/Paris
    volumes:
      # PostgreSQL 18+ : monter /var/lib/postgresql (les données sont dans 18/docker).
      - laponie-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Sauvegardes automatiques de la base, avec rotation (voir README).
  backup:
    image: postgres:18-alpine
    container_name: laponie-backup
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/backup.sh", "loop"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-laponie}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      PGDATABASE: ${POSTGRES_DB:-laponie}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      TZ: Europe/Paris
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  # Réseau privé app <-> base, jamais exposé au proxy.
  internal:
  # Réseau de Nginx Proxy Manager (doit déjà exister).
  npm:
    external: true
    name: ${NPM_NETWORK:-npm_default}

volumes:
  laponie-pgdata:
